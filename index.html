<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="بدّي وبدّك — منصة سورية للمقايضة وبيع وإهداء الأغراض المستعملة" />
    <meta property="og:title" content="بدّي وبدّك | منصة المقايضة والبيع في سوريا" />
    <meta property="og:description" content="بدّك شي ومعك شي؟ قايض، بيع، أو أهدِ أغراضك المستعملة لغيرك في سوريا." />

    <title>بدّي وبدّك | منصة المقايضة والبيع في سوريا</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bw-bd-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
